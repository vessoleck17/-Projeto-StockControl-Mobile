
name: stockcontrol_mobile
description: Aplicativo mobile do sistema StockControl - PIM IV
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Comunicação com a API
  http: ^1.2.2

  # Armazenamento seguro do token JWT
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true
